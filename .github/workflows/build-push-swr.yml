name: Build and push images to SWR

on:
  push:
    branches: [main]
    paths: ["agent-backend/**", "agent-interface/**", ".github/workflows/build-push-swr.yml"]
  workflow_dispatch:

# Repository secrets:
#   SWR_REGISTRY  e.g. swr.me-east-1.myhuaweicloud.com
#   SWR_ORG       SWR organization
#   SWR_USERNAME  <region>@<access key>      (from "Generate Login Command" -> long-term)
#   SWR_PASSWORD  long-term login key

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r agent-backend/requirements-dev.txt
      - run: cd agent-backend && python -m pytest -q

  build:
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            context: agent-backend
          - app: frontend
            context: agent-interface
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/ai-agent-${{ matrix.app }}:latest
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/ai-agent-${{ matrix.app }}:${{ github.sha }}
