apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-frontend
  labels: { app: ai-agent-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-agent-frontend }
  template:
    metadata:
      labels: { app: ai-agent-frontend }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: default-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ai-agent-frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: BACKEND_URL
              value: http://ai-agent-backend:8000
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-frontend
  labels: { app: ai-agent-frontend }
spec:
  selector: { app: ai-agent-frontend }
  ports:
    - name: http
      port: 3000
      targetPort: http
