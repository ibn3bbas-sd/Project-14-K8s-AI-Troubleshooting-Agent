# Deliberately broken workloads for testing the agent. Each one fails in a
# different way. Apply:   kubectl apply -f k8s/test-scenarios/broken-workloads.yaml
# Remove:                 kubectl delete namespace agent-lab
apiVersion: v1
kind: Namespace
metadata:
  name: agent-lab
---
# 1) Pending: nodeSelector that no node satisfies (bare pod, immutable spec).
apiVersion: v1
kind: Pod
metadata:
  name: web-service
  namespace: agent-lab
  labels: { app: web-service }
spec:
  nodeSelector:
    type: web
  containers:
    - name: web-service
      image: nginx:1.27-alpine
      resources:
        requests: { cpu: 50m, memory: 32Mi }
---
# 2) ImagePullBackOff: tag that does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: agent-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: catalog
          image: nginx:1.27-alpinee
          resources:
            requests: { cpu: 50m, memory: 32Mi }
---
# 3) CrashLoopBackOff: the app exits because a required setting is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: agent-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$DB_HOST" ]; then
                echo "FATAL: environment variable DB_HOST is not set" >&2; exit 1
              fi
              echo "connected to $DB_HOST"; sleep 3600
          envFrom:
            - configMapRef: { name: payments-config }
          resources:
            requests: { cpu: 20m, memory: 16Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: agent-lab
data:
  DB_PORT: "5432"
---
# 4) OOMKilled: allocates more memory than its limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: agent-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: report-worker } }
  template:
    metadata: { labels: { app: report-worker } }
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-c", "b = bytearray(100 * 1024 * 1024); import time; time.sleep(3600)"]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 48Mi }
---
# 5) Service with no endpoints: selector label typo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agent-lab
spec:
  selector: { app: front-end }
  ports:
    - port: 80
      targetPort: http
---
# 6) CreateContainerConfigError: references a ConfigMap that does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: agent-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: notifier } }
  template:
    metadata: { labels: { app: notifier } }
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef: { name: notifier-settings, key: SMTP_HOST }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
